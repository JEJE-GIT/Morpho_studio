{% include '_partials/_header.html' %}

<section class="contact_section wrapper">
    <h2>Contact</h2>

    <div class="formulaire">
        <form action="https://formsubmit.co/Infosmorphostudio@gmail.com" method="POST">
            <div class="form_group">
                <label for="prenom">Nom Complet</label>
                <input type="text" id="prenom" name="prenom" placeholder="Prénom" />
                <input type="text" id="nom" name="nom" placeholder="Nom" />
            </div>

            <div class="form_group">
                <label for="entreprise">Entreprise <span>*</span></label>
                <input type="text" id="entreprise" name="entreprise" placeholder="Nom de l'entreprise" required />
            </div>

            <div class="form_group">
                <label for="email">Email et téléphone <span>*</span></label>
                <input type="email" id="email" name="email" placeholder="Email" required />
                <input type="tel" id="telephone" name="telephone" placeholder="Téléphone" required />
            </div>

            <div class="form_group">
                <label>Besoin(s) <span>*</span></label>
                <div class="checkbox_group">
                    <label class="besoins"
                        ><input type="checkbox" name="besoin branding et design" value="OUI" /> Design & Branding</label
                    >
                    <label class="besoins"><input type="checkbox" name="besoin Web" value="OUI" /> Web</label>
                    <label class="besoins"><input type="checkbox" name="besoin 3d" value="OUI" /> Création 3D</label>
                    <label class="besoins"><input type="checkbox" name="besoin Média" value="OUI" /> Médias</label>
                    <label class="besoins"><input type="checkbox" name="besoin Autre" value="OUI" /> Autre</label>
                </div>
            </div>

            <div class="form_group">
                <label for="message">Message <span>*</span></label>
                <textarea id="message" name="message" placeholder="Écrivez votre message ici" required></textarea>
            </div>

            <button type="submit" class="btn_contact">Envoyer</button>
        </form>
    </div>
</section>

{% include '_partials/_footer.html' %}
